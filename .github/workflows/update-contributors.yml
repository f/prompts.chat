name: Update Contributors

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history needed for commit deduplication
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run contributor generation script
        env:
          PROJECT_DIR: ${{ github.workspace }}
        run: |
          chmod +x scripts/generate-contributors.sh
          ./scripts/generate-contributors.sh

      - name: Check prompts.csv has no contributor emails
        run: |
          python3 << 'EOF'
          import csv, sys
          csv.field_size_limit(sys.maxsize)
          with open("prompts.csv", newline="", encoding="utf-8") as f:
              bad = sum(1 for row in csv.DictReader(f) if "@" in (row.get("contributor") or ""))
          if bad:
              print(f"::error::{bad} rows in prompts.csv have an email-like contributor; refusing to publish")
              sys.exit(1)
          print("No contributor emails found")
          EOF

      - name: Push changes
        run: |
          git push origin main --force-with-lease

      - name: Sync to Hugging Face
        env:
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
        run: |
          pip install "huggingface_hub>=0.20"
          python3 << 'EOF'
          import os
          from huggingface_hub import HfApi
          
          repo_id = "fka/prompts.chat"
          api = HfApi(token=os.environ["HF_API_TOKEN"])
          api.upload_file(
              path_or_fileobj="prompts.csv",
              path_in_repo="prompts.csv",
              repo_id=repo_id,
              repo_type="dataset",
              commit_message="Update prompts.csv"
          )
          print("Successfully synced prompts.csv to Hugging Face")
          # Keep the dataset repo at a single commit so its history (and any
          # previously published contributor data) doesn't accumulate.
          api.super_squash_history(
              repo_id=repo_id,
              repo_type="dataset",
              commit_message="Update prompts.csv"
          )
          print("Squashed Hugging Face history")
          EOF
